name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Check installer shell syntax
        run: sh -n install.sh

      - name: Check installer dry runs
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          export EDGEPAD_VERSION="v$PACKAGE_VERSION"
          ./install.sh --dry-run
          ./install.sh --uninstall --dry-run
          ./install.sh --uninstall --purge --dry-run

      - name: Run clippy
        run: nix develop --command cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: nix develop --command cargo test --locked

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check

      - name: Build package
        run: nix build .#edgepad
